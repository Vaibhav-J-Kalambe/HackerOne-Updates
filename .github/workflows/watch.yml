name: HackerOne Directory Watch

on:
  schedule:
    # Every 15 minutes. GitHub may delay this under load; treat as "best effort".
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hackerone-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: python scripts/check_hackerone.py

      - name: Commit updated state
        run: |
          git config user.name "hackerone-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_programs.json
          git diff --cached --quiet || git commit -m "Update program state [skip ci]"
          git push
